<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SciFac Events</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


    <style>
        :root {
            --primary-blue: #007bff;
            --dark-grey: #212529;
            --light-grey-bg: #f8f9fa;
            --text-color: #333;
            --text-muted: #6c757d;
            --card-border: #dee2e6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', serif;
            background-color: var(--light-grey-bg);
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 70px;
            padding: 0 20px;
        }

        img {
            max-width: 100%;
            display: block;
        }

        a {
            text-decoration: none;
            color: inherit;
            font-size: 1.25rem;
        }

        /* --- 2. Header / Navigation --- */
        .main-header {
            background-color: var(--dark-grey);
            padding: 15px 0;
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .main-header .container {
            display: flex;
            justify-content: left;
            align-items: center;
        }

        .title {
            font-size: 2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .main-nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        .main-nav a {
            color: #e9ecef;
            font-weight: 500;
            transition: color 0.3s;
        }

        .main-nav a:hover,
        .main-nav a.active {
            color: white;
        }

        /* --- 3. Highlighted Section --- */
        .highlight {
            margin: 20px 40px;
            position: center;
            height: 450px;
            background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2070') no-repeat center center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            outline: 2px solid rgb(156, 156, 156);
        }

        .highlight-overlay {
            transform: translateY(+20%);
            background-color: rgba(0, 0, 0, 0.5);
            padding: 40px 60px;
            text-align: center;
            border-radius: 8px;
        }

        .highlight h1 {
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .highlight p {
            font-size: 1.1rem;
            margin-bottom: 25px;
            color: #e9ecef;
        }

        .highlight-button {
            background-color: var(--primary-blue);
            color: white;
            padding: 12px 25px;
            border-radius: 5px;
            font-weight: 600;
            transition: background-color 0.3s;
        }

        .highlight-button:hover {
            background-color: #0056b3;
        }

        .highlight-nav {
            margin: 20px 40px;
            position: absolute;
            top: 50%;
            transform: translateY(-240%);
            font-size: 2rem;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            padding: 10px;
        }

        .highlight-nav.left {
            left: 20px;
        }

        .highlight-nav.right {
            right: 20px;
        }
    </style>
</head>

<body>
    <!-- =========== Header =========== -->

    <header class="main-header">
        <div class="container">
            <a href="#" class="title">
                <h1 class="title">SciFac Events</h1>
            </a>

            <nav class="main-nav">
                <ul>
                    <li></li>
                    <li><a href="#" class="active">Home</a></li>
                    <li><a href="#">Events</a></li>
                    <li><a href="#">Venues</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <!-- ======================= highlight Section ======================= -->
        <section class="highlight">
            <div class="highlight-overlay">
                <h1>Global Climate Summit</h1>
                <p>Nov 1, 2026, 10:00 AM - Grand Science Hall</p>
                <a href="#" class="highlight-button">View Details</a>
            </div>
                <div class="highlight-nav left"><</div>
                <div class="highlight-nav right">></div>
        </section>
    </main>


</body>
