<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SciFac Events</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <style>
        :root {
            --primary-blue: #007bff;
            --dark-grey: #212529;
            --light-grey-bg: #f8f9fa;
            --text-color: #333;
            --text-muted: #6c757d;
            --card-border: #dee2e6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', serif;
            background-color: var(--light-grey-bg);
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 70px;
            padding: 0 20px;
        }

        img {
            max-width: 100%;
            display: block;
        }

        a {
            text-decoration: none;
            color: inherit;
            font-size: 1.25rem;
        }

        /* --- 2. Header / Navigation --- */
        .main-header {
            background-color: var(--dark-grey);
            padding: 15px 0;
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .main-header .container {
            display: flex;
            justify-content: left;
            align-items: center;
        }

        .title {
            font-size: 2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .main-nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        .main-nav a {
            color: #e9ecef;
            font-weight: 500;
            transition: color 0.3s;
        }

        .main-nav a:hover,
        .main-nav a.active {
            color: white;
        }

        /* --- 6. Responsive Design --- */
        @media (max-width: 992px) {
            .events-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .main-header .container {
                flex-direction: column;
                gap: 15px;
            }

            .highlight h1 {
                font-size: 2rem;
            }

            .highlight-overlay {
                padding: 30px;
            }

            .events-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <!-- =========== Header =========== -->

    <header class="main-header">
        <div class="container">
            <a href="#" class="title">
                <h1 class="title">SciFac Events</h1>
            </a>

            <nav class="main-nav">
                <ul>
                    <li></li>
                    <li><a href="#" class="active">Home</a></li>
                    <li><a href="#">Events</a></li>
                    <li><a href="#">Venues</a></li>
                </ul>
            </nav>
        </div>
</body>
